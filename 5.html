<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>WIBU</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
/* Layout: một cột giữa trang, bảng thẻ là tâm điểm; số liệu nằm gọn trên đầu bảng. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --fg: #14202b;
  --muted: #5b6b7a;
  --line: #d3dbe4;
  --accent: #2b45e8;
  --accent-fg: #ffffff;
  --match: #1f9d62;
  --match-bg: #e3f6ec;
  --back-a: #2b45e8;
  --back-b: #3d58ff;
  --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c;
    --surface: #18212b;
    --fg: #e8eef4;
    --muted: #93a3b3;
    --line: #2b3745;
    --accent: #7b8dff;
    --accent-fg: #0f151c;
    --match: #4cd08f;
    --match-bg: #14342a;
    --back-a: #3a4fd6;
    --back-b: #4c63f0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c;
  --surface: #18212b;
  --fg: #e8eef4;
  --muted: #93a3b3;
  --line: #2b3745;
  --accent: #7b8dff;
  --accent-fg: #0f151c;
  --match: #4cd08f;
  --match-bg: #14342a;
  --back-a: #3a4fd6;
  --back-b: #4c63f0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header h1 {
  margin: 0;
  font-size: clamp(1.9rem, 7vw, 2.6rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  text-wrap: balance;
}
header p { margin: 6px 0 0; color: var(--muted); max-width: 46ch; }
 
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button {
  font: inherit; font-size: 0.875rem; font-weight: 500;
  border: 0; background: transparent; color: var(--muted);
  padding: 7px 14px; border-radius: 7px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--fg); }
.btn {
  font: inherit; font-weight: 700; font-size: 0.875rem;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 9px 16px; border-radius: 10px; cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
 
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat span { display: block; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stat b { display: block; font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; }
 
.board { display: grid; gap: var(--gap, 8px); container-type: inline-size; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
.card {
  position: relative; aspect-ratio: 1 / 1; padding: 0; border: 0; background: none;
  cursor: pointer; perspective: 700px; font: inherit; -webkit-tap-highlight-color: transparent;
}
.card .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.38s cubic-bezier(.3,.7,.3,1); }
.card.up .in { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; border-radius: min(12px, calc(100cqw / var(--cols) * 0.2)); backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: grid; place-items: center;
}
.back {
  background:
    linear-gradient(145deg, var(--back-a), var(--back-b));
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.18);
}
.back::after {
  content: "anime";
  color: rgba(255,255,255,.92);
  font-weight: 800;
  letter-spacing: 0.02em;
  font-size: clamp(0.7rem, 2.6vw, 1.1rem);
  font-size: calc(100cqw / var(--cols) * 0.27);
}
.front {
  transform: rotateY(180deg);
  background: var(--surface);
  border: 2px solid var(--line);
  font-size: clamp(1.6rem, 8vw, 2.7rem);
  font-size: calc(100cqw / var(--cols) * 0.58);
  line-height: 1;
}
.card.done .front { background: var(--match-bg); border-color: var(--match); }
.card.done { cursor: default; }
.card.done .in { animation: pop 0.4s ease; }
@keyframes pop { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.08); } 100% { transform: rotateY(180deg) scale(1); } }
.card.shake .in { animation: shake 0.35s ease; }
@keyframes shake { 0%,100% { transform: rotateY(180deg) translateX(0); } 25% { transform: rotateY(180deg) translateX(-4px); } 75% { transform: rotateY(180deg) translateX(4px); } }
 
.upload { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.upload .hint { min-width: 0; flex: 1 1 200px; }
.front img { width: 88%; height: 88%; object-fit: cover; border-radius: 8px; display: block; }
.win {
  background: var(--match-bg); border: 1px solid var(--match); border-radius: 14px;
  padding: 16px 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
}
.win p { margin: 0; min-width: 0; }
.win strong { display: block; font-size: 1.15rem; font-weight: 800; }
.win span { color: var(--muted); font-size: 0.9rem; }
.hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
 
@media (max-width: 420px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .board { --gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .card .in { transition: none; }
  .card.done .in, .card.shake .in { animation: none; }
}
</style>
</head>
<body>

  <audio id="bg-music" loop autoplay >
   <source src="5.mp3" type="audio/mpeg" />
  </audio>
 
<div class="wrap">
  <header>
    <h1>Game Cho Wibu</h1>
    <p>Lật hai thẻ mỗi lượt. Hai hình giống nhau thì thẻ được giữ nguyên vị trí, còn khác nhau thì úp lại.</p>
  </header>
 
  <div class="controls">
    <div class="seg" role="group" aria-label="Chọn độ khó" id="levels"></div>
    <button class="btn primary" id="restart" type="button">Chơi lại</button>
  </div>
 
  <div class="stats" aria-live="off">
    <div class="stat"><span>Lượt lật</span><b id="moves">0</b></div>
    <div class="stat"><span>Thời gian</span><b id="time">0:00</b></div>
    <div class="stat"><span>Đã ghép</span><b id="pairs">0/0</b></div>
    <div class="stat"><span>Kỷ lục</span><b id="best">–</b></div>
  </div>
 
  <div class="board" id="board" role="group" aria-label="Bảng thẻ"></div>
 
  <div class="win" id="win" hidden role="status">
    <p><strong>Bạn đã ghép hết các cặp!</strong><span id="winText"></span></p>
    <button class="btn primary" id="again" type="button">Ván mới</button>
  </div>
 
  <p class="hint">Mẹo: nhớ vị trí các hình đã lật để ghép với ít lượt nhất.</p>
</div>
 
<script>
(function () {
  var IMAGES = [];
  var LEVELS = [
    { id: "de",   name: "Dễ",   cols: 4, pairs: 6 },
    { id: "vua",  name: "Vừa",  cols: 4, pairs: 8 },
    { id: "kho",  name: "Khó",  cols: 6, pairs: 12 },
    { id: "xl",   name: "siêu khó", cols: 12, pairs: 36 }
  ];
  var level = LEVELS[3];
  var first = null, second = null, lock = false;
  var moves = 0, matched = 0, seconds = 0, timer = null, started = false;
 
  var $ = function (id) { return document.getElementById(id); };
  var board = $("board");
 
  function getBest(l) { try { return JSON.parse(localStorage.getItem("lathinh-best") || "{}")[l.id] || null; } catch (e) { return null; } }
  function setBest(l, v) {
    try {
      var o = JSON.parse(localStorage.getItem("lathinh-best") || "{}");
      o[l.id] = v; localStorage.setItem("lathinh-best", JSON.stringify(o));
    } catch (e) {}
  }
  function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
 
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
 
  function renderBest() {
    var b = getBest(level);
    $("best").textContent = b ? b.moves + " lượt" : "–";
  }
  function renderStats() {
    $("moves").textContent = moves;
    $("time").textContent = fmt(seconds);
    $("pairs").textContent = matched + "/" + level.pairs;
  }
 
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
 
  function newGame() {
    stopTimer();
    first = second = null; lock = false;
    moves = 0; matched = 0; seconds = 0; started = false;
    $("win").hidden = true;
    board.style.setProperty("--cols", level.cols);
    board.style.setProperty("--gap", level.cols >= 12 ? "3px" : "");
    board.innerHTML = "";
    var p = pool().slice(0, level.pairs);
    var deck = shuffle(p.concat(p));
    deck.forEach(function (it, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "card";
      b.dataset.img = it.k;
      b.setAttribute("aria-label", "Thẻ " + (i + 1) + ", đang úp");
      b.innerHTML = '<span class="in"><span class="face back"></span><span class="face front" aria-hidden="true">' + (it.src ? '<img src="' + it.src + '"' + (it.base ? ' data-base="' + it.base + '" data-i="0"' : '') + ' alt="">' : it.txt) + '</span></span>';
      var im = b.querySelector("img[data-base]");
      if (im) im.addEventListener("error", function () { nextExt(im); });
      b.addEventListener("click", function () { flip(b, i); });
      board.appendChild(b);
    });
    renderStats(); renderBest(); renderStats(); renderBest();
  }
 
  function flip(card, i) {
    if (lock || card.classList.contains("up") || card.classList.contains("done")) return;
    if (!started) {
      started = true;
      timer = setInterval(function () { seconds++; $("time").textContent = fmt(seconds); }, 1000);
    }
    card.classList.add("up");
    card.setAttribute("aria-label", "Thẻ " + (i + 1) + ", đã lật");
    if (!first) { first = card; return; }
    second = card;
    moves++;
    lock = true;
    renderStats();
    if (first.dataset.img === second.dataset.img) {
      // Giống nhau: giữ nguyên mặt ngửa tại vị trí cũ.
      first.classList.add("done"); second.classList.add("done");
      matched++;
      first = second = null; lock = false;
      renderStats();
      if (matched === level.pairs) finish();
    } else {
      // Khác nhau: rung nhẹ rồi úp lại.
      var a = first, b = second;
      setTimeout(function () { a.classList.add("shake"); b.classList.add("shake"); }, 450);
      setTimeout(function () {
        [a, b].forEach(function (c) {
          c.classList.remove("up", "shake");
          var idx = Array.prototype.indexOf.call(board.children, c) + 1;
          c.setAttribute("aria-label", "Thẻ " + idx + ", đang úp");
        });
        first = second = null; lock = false;
      }, 950);
    }
  }
 
  function finish() {
    stopTimer();
    var best = getBest(level);
    var record = !best || moves < best.moves || (moves === best.moves && seconds < best.seconds);
    if (record) setBest(level, { moves: moves, seconds: seconds });
    $("winText").textContent = moves + " lượt trong " + fmt(seconds) + (record ? ". Kỷ lục mới ở mức " + level.name + "." : ".");
    $("win").hidden = false;
    renderBest();
  }
 
  var seg = $("levels");
  LEVELS.forEach(function (l) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = l.name;
    b.setAttribute("aria-pressed", l === level ? "true" : "false");
    b.addEventListener("click", function () {
      level = l;
      Array.prototype.forEach.call(seg.children, function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
      newGame();
    });
    seg.appendChild(b);
  });
 
  var EXTS = ["jpg", "jpeg", "png", "webp", "gif", "jfif"];   // game tự thử lần lượt các đuôi này
  var custom = [];
  for (var n = 1; n <= 36; n++) custom.push("c" + n);          // c1 ... c36
  function nextExt(img) {
    var i = +img.dataset.i + 1;
    if (i >= EXTS.length) return;
    img.dataset.i = i;
    img.src = img.dataset.base + "." + EXTS[i];
  }
  function pool() {
    return custom.map(function (name, i) {
      return /^data:/.test(name)
        ? { k: "u" + i, src: name }
        : { k: name, src: name + "." + EXTS[0], base: name };
    });
  }
  function renderInfo() {
    var n = custom.length;
    $("clearImgs").hidden = true;
    $("imgInfo").textContent = n
      ? "Đã tải " + n + " ảnh. Mức này cần " + level.pairs + " ảnh" + (n < level.pairs ? ", phần thiếu dùng hình mặc định." : ".")
      : "Chưa tải ảnh, đang dùng hình mặc định.";
  }
  function loadFile(file) {
    return new Promise(function (res) {
      var fr = new FileReader();
      fr.onload = function () {
        var im = new Image();
        im.onload = function () {
          var s = 160, c = document.createElement("canvas");
          c.width = c.height = s;
          var x = c.getContext("2d");
          var r = Math.max(s / im.width, s / im.height);
          var w = im.width * r, h = im.height * r;
          x.drawImage(im, (s - w) / 2, (s - h) / 2, w, h);
          res(c.toDataURL("image/jpeg", 0.85));
        };
        im.onerror = function () { res(null); };
        im.src = fr.result;
      };
      fr.onerror = function () { res(null); };
      fr.readAsDataURL(file);
    });
  }

  $("restart").addEventListener("click", newGame);
  $("again").addEventListener("click", newGame);
  newGame();
})();
</script>
</body>
</html>
